name: Scan deals
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Discover and verify gaming deals
        run: |
          TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deal-scout" | jq -r '.value')"
          curl --fail --retry 2 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://deal-scout.johnpz287.chatgpt.site/api/discover"
          OIDC_TOKEN="$TOKEN" \
            SITE_URL="https://deal-scout.johnpz287.chatgpt.site" \
            node scripts/github-scan.mjs
