name: Scan deals
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check tracked retailer pages
        run: |
          curl --fail --retry 2 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.DEALSCOUT_CRON_SECRET }}" \
            "https://deal-scout.johnpz287.chatgpt.site/api/scan"
